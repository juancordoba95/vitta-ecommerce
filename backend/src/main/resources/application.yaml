spring:
  application:
    name: vitta-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    # Lets SPRING_PROFILES_ACTIVE work from backend/.env too (not only as a real env var).
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:3000}
