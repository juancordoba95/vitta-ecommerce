spring:
  application:
    name: vitta-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    # Lets SPRING_PROFILES_ACTIVE work from backend/.env too (not only as a real env var).
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      # Per-file limit enforced again by AdminImageService; a request carries up to 8 images.
      max-file-size: 5MB
      max-request-size: 45MB

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:3000}
  security:
    jwt:
      # Required (at least 32 bytes); there is no default outside the dev profile.
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:8h}
  # Initial admin, created on startup if missing. Optional: if unset, only a warning is logged.
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  # Product images: Cloudinary if CLOUDINARY_URL is set, otherwise local files served at /uploads/**.
  storage:
    cloudinary-url: ${CLOUDINARY_URL:}
    uploads-dir: ${UPLOADS_DIR:./uploads}
